name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend ml
      - run: python ml/make_samples.py
      - run: pytest backend/tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cardiocare .
      - name: Smoke test the container
        run: |
          docker run -d --name cc -p 7860:7860 cardiocare
          for i in $(seq 1 30); do
            curl -sf http://localhost:7860/api/health && break || sleep 2
          done
          curl -sf http://localhost:7860/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          docker rm -f cc
